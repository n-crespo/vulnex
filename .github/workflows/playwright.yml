name: Playwright Tests
on:
  push:
    branches: [main, master]
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.js"
      - "package.json"
      - ".github/workflows/playwright.yml"
      - "!README.md"
      - "!LICENSE"
      - "!.gitignore"
      - "playwright.config.js"
      - "."

  pull_request:
    branches: [main, master]

  # can run manually from actions tab
  workflow_dispatch:

# stop previously running workflows on new commit push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    # this block spins up a temporary mongodb instance specifically for this job
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # seed fake cves so the unmocked ui tests have something to render
      - name: Seed test database
        run: |
          docker exec -i ${{ job.services.mongodb.id }} \
            mongoimport --db test_db --collection cves --jsonArray \
            < tests/e2e/fixtures/cves.json

      - name: Run Playwright tests
        env:
          # always use the temporary ci database, never production
          MONGO_DB_URI: "mongodb://localhost:27017/test_db"
          JWT_SECRET: "ci_test_jwt_secret"
          NODE_ENV: test
          PORT: 3000
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
