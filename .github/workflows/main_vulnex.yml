name: Deploy API to Azure Web App - vulnex

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: "22.x"

      - name: Install Dependencies (Root Workspace)
        run: npm install

      - name: "Deploy to Azure Web App"
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: "vulnex"
          slot-name: "Production"
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_84CF847B4D044C819796EAC247E6948A }}

# 💡 ACTION REQUIRED: After this deployment runs, you must navigate to your App Service
# in the Azure Portal > Configuration > General settings, and set the
# Startup Command to: 'npm run start:api' (See Scenario A above).
