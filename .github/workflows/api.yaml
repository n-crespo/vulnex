name: API Integration Tests

on:
  # can run manually from actions tab
  workflow_dispatch:
  push:
    paths:
      - "api/**"
      - "tests/**"
      - ".github/workflows/api.yaml"
  pull_request:
    paths:
      - "api/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest

    # this block spins up a temporary mongodb instance specifically for this job
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Start API server
        env:
          # force the app to look at the temporary ci database
          MONGO_DB_URI: "mongodb://localhost:27017/test_db"
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
          PORT: 3000
        run: |
          npm run start:api &
          npx wait-on http://localhost:3000

      - name: Run tests
        env:
          MONGO_DB_URI: "mongodb://localhost:27017/test_db"
          API_SECRET_KEY: ${{ secrets.API_SECRET_KEY }}
        run: npm run test:api:action
